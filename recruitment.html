<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join INDICUS | Recruitment</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <nav class="navbar">
        <a href="index.html" class="logo">
            <img src="IndicusLogo.png" alt="INDICUS Logo">
            <span>INDICUS</span>
        </a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#about">About</a>
            <a href="index.html#team">Team</a>
            <a href="recruitment.html" class="active">Recruitment</a>
        </div>
    </nav>
</header>

<main>

    <section class="recruit-hero">
        <h1>JOIN <span>INDICUS</span></h1>
        <p>Think you have what it takes? Apply to become a part of our team.</p>
    </section>

    <section class="application-section">

        <div class="form-card">

            <h2>Recruitment Application</h2>
            <p>Fill in your details accurately before submitting.</p>

            <form id="applicationForm">

                <h3>01 — Player Information</h3>

                <div class="form-grid">

                    <div class="form-group">
                        <label for="username">HCR2 Username *</label>
                        <input type="text" id="username" name="username" required>
                    </div>

                    <div class="form-group">
                        <label for="playerID">Player ID *</label>
                        <input type="text" id="playerID" name="playerID" required>
                    </div>

                    <div class="form-group">
                        <label for="discord">Discord Username *</label>
                        <input type="text" id="discord" name="discord" required>
                    </div>

                    <div class="form-group">
                        <label for="currentTeam">Current / Previous Team</label>
                        <input type="text" id="currentTeam" name="currentTeam"
                               placeholder="Enter N/A if none">
                    </div>

                </div>

                <h3>02 — Game Statistics</h3>

                <div class="form-grid">

                    <div class="form-group">
                        <label for="bestVehicle">Best Vehicle *</label>
                        <input type="text" id="bestVehicle" name="bestVehicle" required>
                    </div>

                    <div class="form-group">
                        <label for="personalBest">Personal Best Distance *</label>
                        <input type="text" id="personalBest" name="personalBest" required>
                    </div>

                    <div class="form-group">
                        <label for="garagePower">GP *</label>
                        <input type="number" id="garagePower" name="gp"
                               min="0" required>
                    </div>

                    <div class="form-group">
                        <label for="vehicleMasteries">Number of Vehicle Masteries *</label>
                        <input type="number" id="vehicleMasteries"
                               name="vehicleMasteries" min="0" required>
                    </div>

                    <div class="form-group">
                        <label for="weeklyActivity">Weekly Activity *</label>
                        <input type="text" id="weeklyActivity"
                               name="weeklyActivity"
                               placeholder="Hours played per week" required>
                    </div>

                    <div class="form-group">
                        <label for="playingExperience">Playing Experience *</label>
                        <input type="text" id="playingExperience"
                               name="playingExperience"
                               placeholder="How long have you played?" required>
                    </div>

                </div>

                <h3>03 — Application</h3>

                <div class="form-group">
                    <label for="reason">Why do you want to join INDICUS? *</label>
                    <textarea id="reason" name="reason" rows="5"
                              maxlength="500" required></textarea>
                </div>

                <div class="form-group">
                    <label for="additionalInfo">Additional Information</label>
                    <textarea id="additionalInfo" name="additionalInfo"
                              rows="4" maxlength="500"></textarea>
                </div>

                <div class="submit-area">
                    <button type="submit" class="submit-btn">
                        SUBMIT APPLICATION
                    </button>
                </div>

            </form>

        </div>

    </section>

</main>

<footer class="footer">
    <p>© 2026 INDICUS. All rights reserved.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
